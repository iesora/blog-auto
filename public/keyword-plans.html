<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キーワード生成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }
    .nav {
      max-width: 960px;
      margin: 0 auto 16px;
      font-size: 0.85rem;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav a { color: #4a90d9; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .nav .current {
      color: #333;
      font-weight: 700;
      cursor: default;
      border-bottom: 2px solid #4a90d9;
      padding-bottom: 1px;
    }
    .page { max-width: 960px; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 1.5rem; }
    .header .subtitle { color: #888; font-size: 0.9rem; margin-top: 4px; }
    .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    button {
      padding: 12px 18px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #3a7bc8; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.ghost { background: #fff; color: #4a90d9; border: 1px solid #4a90d9; }
    button.ghost:hover { background: #f0f6fc; }
    button.success { background: #2e8b57; }
    button.success:hover { background: #266e46; }
    button.danger { background: #d96a6a; }
    button.danger:hover { background: #c25555; }
    button.small { padding: 6px 12px; font-size: 0.8rem; }

    select.select {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      min-width: 180px;
    }
    select.select:focus { border-color: #4a90d9; }
    select.select:disabled { background: #f5f5f5; color: #888; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 20px; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #2e8b57; color: #fff; }
    .toast.error { background: #d96a6a; color: #fff; }

    .list { display: grid; gap: 12px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card.draft { border-left: 3px solid #d97706; }
    .card.approved { border-left: 3px solid #2e8b57; }
    .card.rejected { border-left: 3px solid #888; opacity: 0.65; }

    .card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .cycle-range {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: #444;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.draft { background: #fff5e6; color: #d97706; }
    .badge.approved { background: #e6f4ea; color: #2e7d4f; }
    .badge.rejected { background: #f0f0f0; color: #888; }
    .meta {
      color: #888;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .meta code {
      background: #eef2f7;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #444;
    }

    .card-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
    .approved-tag {
      display: inline-block;
      padding: 6px 12px;
      background: #e6f4ea;
      color: #2e7d4f;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    .empty {
      background: #fff;
      border-radius: 12px;
      padding: 60px 24px;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
    }

    /* Modal (詳細表示) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 760px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 28px 32px;
    }
    .modal h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .modal-subtitle { color: #888; font-size: 0.85rem; margin-bottom: 18px; }
    .days-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .days-table th, .days-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }
    .days-table th {
      background: #f6f8fc;
      color: #666;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
    }
    .days-table td.date {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #444;
      white-space: nowrap;
    }
    .chip {
      background: #f0f6fc;
      color: #2c5d8a;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      margin-right: 4px;
      display: inline-block;
    }
    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/sites.html">サイト管理</a>
    <a href="/">スケジュール一覧</a>
    <a href="/generate.html">即時生成</a>
    <span class="current">キーワード生成</span>
    <a href="/gsc-snapshots.html">データ分析</a>
  </div>

  <div class="page">
    <div class="header">
      <div>
        <h1>キーワード生成</h1>
        <p class="subtitle">サイトごとに 4 週間 (28 日) 単位でキーワードを生成・承認します。</p>
      </div>
      <div class="header-actions">
        <select id="filterSite" class="select"><option value="">表示: 全サイト</option></select>
        <button id="openPlanSingleBtn">キーワード生成</button>
        <button id="planAllBtn">全サイトキーワード生成</button>
      </div>
    </div>

    <div id="listArea" class="list"><div class="empty">読み込み中...</div></div>
  </div>

  <!-- サイト選択モーダル (キーワード生成用) -->
  <div class="modal-backdrop" id="planSiteModalBackdrop">
    <div class="modal" style="max-width: 460px;">
      <h2>キーワード生成</h2>
      <p class="modal-subtitle">対象サイトを選んで「実行」をクリックしてください。全サイト分は別ボタン「全サイトキーワード生成」をご利用ください。</p>
      <div class="field" style="margin-top: 16px;">
        <label for="planSiteInModal" style="display:block;font-size:0.85rem;font-weight:600;color:#555;margin-bottom:6px;">対象サイト</label>
        <select id="planSiteInModal" class="select" style="width:100%;">
          <option value="">サイトを選んでください</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="ghost" id="planSiteCancelBtn">キャンセル</button>
        <button type="button" id="planSiteRunBtn" disabled>実行</button>
      </div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">プラン詳細</h2>
      <p class="modal-subtitle" id="modalSubtitle">28 日分のキーワード割り当てを確認できます。</p>
      <div id="daysContainer"></div>
      <div class="modal-footer">
        <button type="button" class="ghost" id="closeBtn">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const filterSite = $('filterSite');
    const openPlanSingleBtn = $('openPlanSingleBtn');
    const planAllBtn = $('planAllBtn');
    const planSiteModalBackdrop = $('planSiteModalBackdrop');
    const planSiteInModal = $('planSiteInModal');
    const planSiteCancelBtn = $('planSiteCancelBtn');
    const planSiteRunBtn = $('planSiteRunBtn');
    const listArea = $('listArea');
    const toast = $('toast');
    const modalBackdrop = $('modalBackdrop');
    const modalTitle = $('modalTitle');
    const modalSubtitle = $('modalSubtitle');
    const daysContainer = $('daysContainer');
    const closeBtn = $('closeBtn');

    let sites = [];

    function showToast(msg, ok = true) {
      toast.textContent = msg;
      toast.className = `toast ${ok ? 'success' : 'error'} show`;
      setTimeout(() => toast.classList.remove('show'), 2800);
    }
    const escapeHtml = (s) => String(s ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    async function loadSites() {
      const res = await fetch('/sites');
      sites = (await res.json()).filter(s => s.active);
      [filterSite, planSiteInModal].forEach(sel => {
        sel.querySelectorAll('option:not(:first-child)').forEach(o => o.remove());
        sites.forEach(s => {
          const o = document.createElement('option');
          o.value = s.slug; o.textContent = `${s.name}（${s.slug}）`;
          sel.appendChild(o);
        });
      });
    }

    async function loadPlans() {
      listArea.innerHTML = '<div class="empty">読み込み中...</div>';
      const params = new URLSearchParams();
      if (filterSite.value) params.set('siteSlug', filterSite.value);
      // rejected は UI 上では存在しないものとして扱う (棄却フロー廃止)
      try {
        const res = await fetch(`/keywords/plans?${params}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const plans = await res.json();
        renderPlans(plans);
      } catch (err) {
        listArea.innerHTML = `<div class="empty">取得失敗: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderPlans(plans) {
      // 棄却フローは廃止したため rejected は一覧から除外
      const visible = plans.filter(p => p.status !== 'rejected');
      if (!visible.length) {
        listArea.innerHTML = `<div class="empty">該当するキーワード生成結果がありません。<br>右上の「全サイトキーワード生成」から作成できます。</div>`;
        return;
      }
      listArea.innerHTML = visible.map(p => {
        const siteName = sites.find(s => s.slug === p.siteSlug)?.name ?? p.siteSlug;
        const created = new Date(p.createdAt).toLocaleString('ja-JP');
        const approved = p.approvedAt
          ? `承認: ${new Date(p.approvedAt).toLocaleString('ja-JP')} (${escapeHtml(p.approvedBy ?? '-')})`
          : '';
        const isApproved = p.status === 'approved';
        const actions = isApproved
          ? `
            <button class="small ghost" data-action="detail">詳細</button>
            <span class="approved-tag">承認済み</span>`
          : `
            <button class="small ghost" data-action="detail">詳細</button>
            <button class="small success" data-action="approve">承認</button>`;
        return `
          <div class="card ${p.status}" data-id="${p.id}">
            <div class="card-body">
              <div class="card-title">
                <span>${escapeHtml(siteName)}</span>
              </div>
              <div class="cycle-range">${escapeHtml(p.cycleStart)} 〜 ${escapeHtml(p.cycleEnd)}</div>
              <div class="meta">
                <span>${created} 生成</span>
                ${approved ? `<span>${escapeHtml(approved)}</span>` : ''}
              </div>
            </div>
            <div class="card-actions">${actions}</div>
          </div>`;
      }).join('');

      listArea.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const card = e.target.closest('.card');
          const id = Number(card.dataset.id);
          const action = e.target.dataset.action;
          if (action === 'detail') showDetail(id);
          else if (action === 'approve') doApprove(id);
        });
      });
    }

    async function showDetail(id) {
      try {
        const res = await fetch(`/keywords/plans/${id}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const detail = await res.json();
        const siteName = sites.find(s => s.slug === detail.siteSlug)?.name ?? detail.siteSlug;
        modalTitle.textContent = `${siteName} の計画 #${detail.id}`;
        const approvedSuffix = detail.status === 'approved' ? '（承認済み）' : '';
        modalSubtitle.textContent = `期間: ${detail.cycleStart} 〜 ${detail.cycleEnd}${approvedSuffix}`;
        const cycleStart = new Date(detail.cycleStart + 'T00:00:00');
        const rows = (detail.days || []).map(d => {
          const date = new Date(cycleStart); date.setDate(date.getDate() + d.offset);
          const dateStr = date.toISOString().slice(0, 10);
          return `
            <tr>
              <td class="date">${dateStr}</td>
              <td>${(d.keywords || []).map(k => `<span class="chip">${escapeHtml(k)}</span>`).join('')}</td>
              <td>${escapeHtml(d.topic || '')}</td>
              <td><code>${escapeHtml(d.articleType || '')}</code></td>
            </tr>`;
        }).join('');
        daysContainer.innerHTML = `
          <table class="days-table">
            <thead><tr><th>日付</th><th>キーワード</th><th>トピック</th><th>記事タイプ</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">days データなし</td></tr>'}</tbody>
          </table>`;
        modalBackdrop.classList.add('show');
      } catch (err) {
        showToast(`詳細取得に失敗: ${err.message}`, false);
      }
    }

    closeBtn.addEventListener('click', () => modalBackdrop.classList.remove('show'));
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove('show');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modalBackdrop.classList.remove('show');
    });

    async function doApprove(id) {
      if (!confirm(`この回のキーワードを承認します。承認すると 28 日分のスケジュールが投稿対象になります。よろしいですか？`)) return;
      try {
        const res = await fetch(`/keywords/plans/${id}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approvedBy: 'admin' }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        showToast('承認しました', true);
        await loadPlans();
      } catch (err) { showToast(`承認失敗: ${err.message}`, false); }
    }

    function openPlanSiteModal() {
      planSiteInModal.value = '';
      planSiteRunBtn.disabled = true;
      planSiteRunBtn.textContent = '実行';
      planSiteModalBackdrop.classList.add('show');
      setTimeout(() => planSiteInModal.focus(), 50);
    }
    function closePlanSiteModal() {
      planSiteModalBackdrop.classList.remove('show');
    }
    openPlanSingleBtn.addEventListener('click', openPlanSiteModal);
    planSiteCancelBtn.addEventListener('click', closePlanSiteModal);
    planSiteModalBackdrop.addEventListener('click', (e) => {
      if (e.target === planSiteModalBackdrop) closePlanSiteModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && planSiteModalBackdrop.classList.contains('show')) closePlanSiteModal();
    });
    planSiteInModal.addEventListener('change', () => {
      planSiteRunBtn.disabled = !planSiteInModal.value;
    });

    planSiteRunBtn.addEventListener('click', async () => {
      const slug = planSiteInModal.value;
      if (!slug) return;
      planSiteRunBtn.disabled = true;
      planSiteRunBtn.textContent = '実行中...';
      try {
        const res = await fetch(`/keywords/plan/${encodeURIComponent(slug)}`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        const data = await res.json();
        showToast(`生成完了 (plan #${data.planId} / schedules ${data.insertedSchedules})`, true);
        closePlanSiteModal();
        await loadPlans();
      } catch (err) {
        showToast(`生成失敗: ${err.message}`, false);
      } finally {
        planSiteRunBtn.disabled = !planSiteInModal.value;
        planSiteRunBtn.textContent = '実行';
      }
    });

    planAllBtn.addEventListener('click', async () => {
      if (!confirm('全 active サイトのキーワードを生成します。サイト数 × 1〜2 分かかります。よろしいですか？')) return;
      planAllBtn.disabled = true;
      try {
        const res = await fetch('/keywords/plan-next-cycle', { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        const data = await res.json();
        showToast(`完了: ${data.succeeded}成功 / ${data.failed}失敗 / 計${data.processed}サイト`, data.failed === 0);
        await loadPlans();
      } catch (err) {
        showToast(`生成失敗: ${err.message}`, false);
      } finally {
        planAllBtn.disabled = false;
      }
    });

    filterSite.addEventListener('change', loadPlans);

    (async () => { await loadSites(); await loadPlans(); })();
  </script>
</body>
</html>
