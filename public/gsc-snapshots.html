<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ分析</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }
    .nav {
      max-width: 960px;
      margin: 0 auto 16px;
      font-size: 0.85rem;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav a { color: #4a90d9; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .nav .current {
      color: #333;
      font-weight: 700;
      cursor: default;
      border-bottom: 2px solid #4a90d9;
      padding-bottom: 1px;
    }
    .page { max-width: 960px; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 { font-size: 1.5rem; }
    .header .subtitle { color: #888; font-size: 0.9rem; margin-top: 4px; }
    .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    button {
      padding: 12px 18px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #3a7bc8; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.ghost { background: #fff; color: #4a90d9; border: 1px solid #4a90d9; }
    button.ghost:hover { background: #f0f6fc; }
    button.small { padding: 6px 12px; font-size: 0.8rem; }
    button.danger { background: #d96a6a; }
    button.danger:hover { background: #c25555; }

    select.select {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      min-width: 200px;
    }
    select.select:focus { border-color: #4a90d9; }
    select.select:disabled { background: #f5f5f5; color: #888; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 20px; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #2e8b57; color: #fff; }
    .toast.error { background: #d96a6a; color: #fff; }

    .empty {
      background: #fff;
      border-radius: 12px;
      padding: 60px 24px;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
    }

    .list { display: grid; gap: 12px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      padding: 16px 22px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: center;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .row-count {
      text-align: center;
      min-width: 90px;
      padding-right: 18px;
      border-right: 1px solid #eee;
    }
    .row-count .num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2c5d8a;
      line-height: 1;
    }
    .row-count .lbl {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 0.05em;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .range {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      color: #444;
    }
    .meta {
      color: #888;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .meta code {
      background: #eef2f7;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #444;
    }
    .card-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

    .info {
      background: #eef4ff;
      border-left: 3px solid #4a90d9;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #2c4666;
      margin-bottom: 20px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 1080px;
      max-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px 12px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }
    .modal-head h2 { font-size: 1.15rem; }
    .modal-head .sub { color: #888; font-size: 0.82rem; margin-top: 2px; }
    .modal-close {
      background: none; color: #888; border: none; font-size: 1.4rem;
      cursor: pointer; padding: 0 6px; line-height: 1;
    }
    .modal-close:hover { color: #333; background: none; }
    .modal-toolbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; flex-wrap: wrap;
      border-bottom: 1px solid #f0f0f0;
    }
    .modal-toolbar input[type="text"] {
      flex: 1; min-width: 180px;
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 0.85rem; outline: none;
    }
    .modal-toolbar input[type="text"]:focus { border-color: #4a90d9; }
    .modal-toolbar label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #555; cursor: pointer; white-space: nowrap; }
    .modal-summary { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.8rem; color: #555; }
    .modal-summary b { color: #2c4666; }
    .table-wrap { overflow: auto; flex: 1; }
    table.gsc {
      width: 100%; border-collapse: collapse; font-size: 0.82rem;
    }
    table.gsc th, table.gsc td {
      padding: 7px 12px; text-align: left; border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    table.gsc th {
      position: sticky; top: 0; background: #f7f9fc; color: #44597a;
      font-weight: 600; cursor: pointer; user-select: none; z-index: 1;
    }
    table.gsc th.num, table.gsc td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.gsc th .arrow { color: #4a90d9; font-size: 0.7rem; margin-left: 3px; }
    table.gsc td.q { font-weight: 600; color: #333; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    table.gsc td.p { color: #4a6f9a; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
    table.gsc td.p a { color: #4a6f9a; text-decoration: none; }
    table.gsc td.p a:hover { text-decoration: underline; }
    table.gsc tbody tr:hover { background: #fafcff; }
    .table-empty { padding: 40px; text-align: center; color: #aaa; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/sites.html">サイト管理</a>
    <a href="/">スケジュール一覧</a>
    <a href="/generate.html">即時生成</a>
    <a href="/keyword-plans.html">キーワード生成</a>
    <span class="current">データ分析</span>
  </div>

  <div class="page">
    <div class="header">
      <div>
        <h1>データ分析</h1>
        <p class="subtitle">Google Search Console のクエリ × ページ実績を取得・保存します。キーワード生成の根拠データになります。</p>
      </div>
      <div class="header-actions">
        <select id="siteSelect" class="select"><option value="">サイトを選んでください</option></select>
        <button id="takeBtn" disabled>＋ 新規スナップショット取得</button>
      </div>
    </div>

    <div class="info">
      取得期間はバックエンド既定 (直近 28 日想定) に従います。実行には 10〜30 秒程度かかります。<br>
      スナップショットは <code>gsc_snapshots</code> + <code>gsc_query_rows</code> に永続化され、Excel エクスポートやキーワード生成の根拠として再利用されます。
    </div>

    <div id="listArea" class="list"><div class="empty">サイトを選ぶと一覧が表示されます。</div></div>
  </div>

  <!-- データ閲覧モーダル -->
  <div class="modal-backdrop" id="rowsBackdrop">
    <div class="modal" role="dialog" aria-labelledby="rowsTitle">
      <div class="modal-head">
        <div>
          <h2 id="rowsTitle">スナップショット</h2>
          <div class="sub" id="rowsSub"></div>
        </div>
        <button class="modal-close" id="rowsClose" aria-label="閉じる">×</button>
      </div>
      <div class="modal-toolbar">
        <input type="text" id="rowsFilter" placeholder="クエリ・ページで絞り込み...">
        <label><input type="checkbox" id="aggToggle"> クエリ単位で集計</label>
        <div class="modal-summary" id="rowsSummary"></div>
      </div>
      <div class="table-wrap" id="rowsTableWrap">
        <div class="table-empty">読み込み中...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const siteSelect = $('siteSelect');
    const takeBtn = $('takeBtn');
    const listArea = $('listArea');
    const toast = $('toast');

    let sites = [];

    function showToast(msg, ok = true) {
      toast.textContent = msg;
      toast.className = `toast ${ok ? 'success' : 'error'} show`;
      setTimeout(() => toast.classList.remove('show'), 2800);
    }
    const escapeHtml = (s) => String(s ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');

    async function loadSites() {
      try {
        const res = await fetch('/sites');
        sites = (await res.json()).filter(s => s.active);
        if (sites.length === 0) {
          siteSelect.innerHTML = '<option value="">登録済みサイトがありません</option>';
          listArea.innerHTML = `<div class="empty">先に <a href="/sites.html" style="color:#4a90d9;">サイト管理</a> でサイトを登録してください。</div>`;
          return;
        }
        siteSelect.innerHTML = '<option value="">サイトを選んでください</option>';
        sites.forEach(s => {
          const o = document.createElement('option');
          o.value = s.slug;
          o.textContent = `${s.name}（${s.slug}）`;
          siteSelect.appendChild(o);
        });
      } catch (err) {
        showToast(`サイト読み込み失敗: ${err.message}`, false);
      }
    }

    async function loadSnapshots() {
      const slug = siteSelect.value;
      if (!slug) {
        listArea.innerHTML = `<div class="empty">サイトを選ぶと一覧が表示されます。</div>`;
        takeBtn.disabled = true;
        return;
      }
      takeBtn.disabled = false;
      listArea.innerHTML = '<div class="empty">読み込み中...</div>';
      try {
        const res = await fetch(`/gsc/snapshots?siteSlug=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const snapshots = await res.json();
        renderSnapshots(snapshots);
      } catch (err) {
        listArea.innerHTML = `<div class="empty">取得失敗: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderSnapshots(snapshots) {
      if (!snapshots.length) {
        listArea.innerHTML = `<div class="empty">このサイトのスナップショットはまだありません。<br>「＋ 新規スナップショット取得」で取得できます。</div>`;
        return;
      }
      const sorted = [...snapshots].sort((a, b) =>
        new Date(b.takenAt).getTime() - new Date(a.takenAt).getTime(),
      );
      listArea.innerHTML = sorted.map(s => {
        const taken = new Date(s.takenAt).toLocaleString('ja-JP');
        return `
          <div class="card" data-id="${s.id}">
            <div class="row-count">
              <div class="num">${s.rowCount.toLocaleString()}</div>
              <div class="lbl">rows</div>
            </div>
            <div class="card-body">
              <div class="card-title">
                <span>スナップショット #${s.id}</span>
              </div>
              <div class="range">${escapeHtml(s.startDate)} 〜 ${escapeHtml(s.endDate)}</div>
              <div class="meta">
                <span>取得日時: <code>${escapeHtml(taken)}</code></span>
              </div>
            </div>
            <div class="card-actions">
              <button class="small" type="button" data-action="view" data-id="${s.id}">データを見る</button>
              <a href="/gsc/snapshots/${s.id}/export.xlsx">
                <button class="small ghost" type="button">Excel ダウンロード</button>
              </a>
              <button class="small danger" type="button" data-action="delete" data-id="${s.id}" data-rows="${s.rowCount}">削除</button>
            </div>
          </div>`;
      }).join('');
    }

    // ── データ閲覧モーダル ──
    const rowsBackdrop = $('rowsBackdrop');
    const rowsTitle = $('rowsTitle');
    const rowsSub = $('rowsSub');
    const rowsFilter = $('rowsFilter');
    const aggToggle = $('aggToggle');
    const rowsSummary = $('rowsSummary');
    const rowsTableWrap = $('rowsTableWrap');

    let currentRows = [];        // 取得した生データ
    let sortKey = 'impressions'; // 既定の並べ替え
    let sortDir = 'desc';

    const COLS = [
      { key: 'query', label: 'クエリ', cls: 'q' },
      { key: 'page', label: 'ページ', cls: 'p' },
      { key: 'clicks', label: 'クリック', cls: 'num' },
      { key: 'impressions', label: '表示回数', cls: 'num' },
      { key: 'ctr', label: 'CTR', cls: 'num' },
      { key: 'position', label: '掲載順位', cls: 'num' },
    ];

    function closeRows() { rowsBackdrop.classList.remove('show'); }

    async function openRows(id) {
      rowsTitle.textContent = `スナップショット #${id}`;
      rowsSub.textContent = '';
      rowsSummary.innerHTML = '';
      rowsFilter.value = '';
      aggToggle.checked = false;
      sortKey = 'impressions';
      sortDir = 'desc';
      currentRows = [];
      rowsTableWrap.innerHTML = '<div class="table-empty">読み込み中...</div>';
      rowsBackdrop.classList.add('show');
      try {
        const res = await fetch(`/gsc/snapshots/${encodeURIComponent(id)}/rows`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentRows = data.rows || [];
        rowsSub.textContent = `${data.startDate} 〜 ${data.endDate} ／ ${data.rowCount.toLocaleString()} 行`;
        renderRows();
      } catch (err) {
        rowsTableWrap.innerHTML = `<div class="table-empty">取得失敗: ${escapeHtml(err.message)}</div>`;
      }
    }

    // クエリ単位の集計（表示回数で加重平均の順位、CTR は再計算）
    function aggregateByQuery(rows) {
      const map = new Map();
      for (const r of rows) {
        let a = map.get(r.query);
        if (!a) { a = { query: r.query, clicks: 0, impressions: 0, posWeighted: 0, pages: new Set() }; map.set(r.query, a); }
        a.clicks += r.clicks;
        a.impressions += r.impressions;
        a.posWeighted += r.position * r.impressions;
        if (r.page) a.pages.add(r.page);
      }
      return [...map.values()].map(a => ({
        query: a.query,
        page: `${a.pages.size} ページ`,
        _pageCount: a.pages.size,
        clicks: a.clicks,
        impressions: a.impressions,
        ctr: a.impressions > 0 ? a.clicks / a.impressions : 0,
        position: a.impressions > 0 ? a.posWeighted / a.impressions : 0,
      }));
    }

    function renderRows() {
      const agg = aggToggle.checked;
      const q = rowsFilter.value.trim().toLowerCase();

      let rows = agg ? aggregateByQuery(currentRows) : currentRows;
      if (q) {
        rows = rows.filter(r =>
          (r.query || '').toLowerCase().includes(q) ||
          (!agg && (r.page || '').toLowerCase().includes(q)),
        );
      }

      rows = [...rows].sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        let cmp;
        if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
        else cmp = String(av ?? '').localeCompare(String(bv ?? ''), 'ja');
        return sortDir === 'asc' ? cmp : -cmp;
      });

      // サマリ
      const totClicks = rows.reduce((s, r) => s + r.clicks, 0);
      const totImp = rows.reduce((s, r) => s + r.impressions, 0);
      const avgCtr = totImp > 0 ? (totClicks / totImp) * 100 : 0;
      rowsSummary.innerHTML =
        `<span>件数 <b>${rows.length.toLocaleString()}</b></span>` +
        `<span>クリック計 <b>${totClicks.toLocaleString()}</b></span>` +
        `<span>表示回数計 <b>${totImp.toLocaleString()}</b></span>` +
        `<span>平均CTR <b>${avgCtr.toFixed(2)}%</b></span>`;

      if (rows.length === 0) {
        rowsTableWrap.innerHTML = '<div class="table-empty">該当するデータがありません。</div>';
        return;
      }

      const arrow = (k) => sortKey === k ? `<span class="arrow">${sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
      const thead = COLS.map(c =>
        `<th class="${c.cls === 'num' ? 'num' : ''}" data-key="${c.key}">${c.label}${arrow(c.key)}</th>`,
      ).join('');

      const fmt = {
        query: (r) => `<td class="q" title="${escapeHtml(r.query)}">${escapeHtml(r.query || '(なし)')}</td>`,
        page: (r) => agg
          ? `<td class="p">${escapeHtml(r.page)}</td>`
          : `<td class="p" title="${escapeHtml(r.page || '')}">${r.page ? `<a href="${escapeHtml(r.page)}" target="_blank" rel="noreferrer">${escapeHtml(r.page)}</a>` : '—'}</td>`,
        clicks: (r) => `<td class="num">${r.clicks.toLocaleString()}</td>`,
        impressions: (r) => `<td class="num">${r.impressions.toLocaleString()}</td>`,
        ctr: (r) => `<td class="num">${(r.ctr * 100).toFixed(2)}%</td>`,
        position: (r) => `<td class="num">${r.position.toFixed(1)}</td>`,
      };
      const body = rows.map(r => `<tr>${COLS.map(c => fmt[c.key](r)).join('')}</tr>`).join('');

      rowsTableWrap.innerHTML = `<table class="gsc"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table>`;

      rowsTableWrap.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => {
          const k = th.dataset.key;
          if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          else { sortKey = k; sortDir = (k === 'query' || k === 'page') ? 'asc' : 'desc'; }
          renderRows();
        });
      });
    }

    rowsFilter.addEventListener('input', renderRows);
    aggToggle.addEventListener('change', renderRows);
    $('rowsClose').addEventListener('click', closeRows);
    rowsBackdrop.addEventListener('click', (e) => { if (e.target === rowsBackdrop) closeRows(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && rowsBackdrop.classList.contains('show')) closeRows();
    });

    listArea.addEventListener('click', (e) => {
      const viewBtn = e.target.closest('[data-action="view"]');
      if (viewBtn) { openRows(viewBtn.dataset.id); return; }
      const delBtn = e.target.closest('[data-action="delete"]');
      if (delBtn) deleteSnapshot(delBtn);
    });

    async function deleteSnapshot(btn) {
      const id = btn.dataset.id;
      const rows = Number(btn.dataset.rows || 0).toLocaleString();
      if (!confirm(`スナップショット #${id}（${rows}行）を削除します。\nデータ行も一緒に削除され、元に戻せません。よろしいですか？`)) return;
      btn.disabled = true;
      btn.textContent = '削除中...';
      try {
        const res = await fetch(`/gsc/snapshots/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        showToast(`スナップショット #${id} を削除しました`, true);
        await loadSnapshots();
      } catch (err) {
        showToast(`削除失敗: ${err.message}`, false);
        btn.disabled = false;
        btn.textContent = '削除';
      }
    }

    siteSelect.addEventListener('change', loadSnapshots);

    takeBtn.addEventListener('click', async () => {
      const slug = siteSelect.value;
      if (!slug) return;
      if (!confirm(`${slug} の GSC データを取得して保存します。10〜30 秒かかります。よろしいですか？`)) return;
      takeBtn.disabled = true;
      takeBtn.textContent = '取得中...';
      try {
        const res = await fetch(`/gsc/snapshots/${encodeURIComponent(slug)}`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
        const data = await res.json();
        showToast(`取得しました (snapshot #${data.id} / ${data.rowCount}行)`, true);
        await loadSnapshots();
      } catch (err) {
        showToast(`取得失敗: ${err.message}`, false);
      } finally {
        takeBtn.disabled = false;
        takeBtn.textContent = '＋ 新規スナップショット取得';
      }
    });

    loadSites();
  </script>
